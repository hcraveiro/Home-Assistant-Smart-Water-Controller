name: Runtime regression tests

on:
  push:
    branches: [main, "review/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety-tests:
    name: Python ${{ matrix.python-version }} / regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test coverage tooling
        run: python -m pip install "coverage[toml]>=7,<8"
      - name: Check Python syntax
        run: python -m compileall -q custom_components tests
      - name: Run regression suite with coverage
        run: python -m coverage run --source=custom_components.smart_water_controller -m unittest discover -s tests -v
      - name: Report coverage
        run: |
          python -m coverage report --show-missing --fail-under=50
          python -m coverage xml -o coverage.xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
